name: licenses

# Regenerates public/THIRD_PARTY_LICENSES.txt from the current dependency trees and fails
# if the committed copy is stale. Run `pnpm gen:licenses` locally after changing deps.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'scripts/gen-licenses.mjs'
      - 'scripts/licenses-preamble.txt'
      - 'scripts/license-templates/**'
      - 'src-tauri/about.toml'
      - 'src-tauri/about.hbs'
      - 'LICENSE'
      - 'public/THIRD_PARTY_LICENSES.txt'
      - '.github/workflows/licenses.yml'
  pull_request:
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'scripts/gen-licenses.mjs'
      - 'scripts/licenses-preamble.txt'
      - 'scripts/license-templates/**'
      - 'src-tauri/about.toml'
      - 'src-tauri/about.hbs'
      - 'LICENSE'
      - 'public/THIRD_PARTY_LICENSES.txt'
      - '.github/workflows/licenses.yml'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-about
        id: cache-cargo-about
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.2-${{ runner.os }}

      - name: Install cargo-about
        if: steps.cache-cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate notices
        run: pnpm gen:licenses

      - name: Check the committed file is up to date
        run: |
          if ! git diff --exit-code -- public/THIRD_PARTY_LICENSES.txt; then
            echo "::error::public/THIRD_PARTY_LICENSES.txt is stale. Run 'pnpm gen:licenses' and commit the result."
            exit 1
          fi
