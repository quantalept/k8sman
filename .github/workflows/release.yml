name: release

# Two ways to run this:
#  - push a tag like "v0.2.0" -> builds every platform and attaches installers to a
#    draft GitHub Release (bump the version in package.json, src-tauri/Cargo.toml, and
#    src-tauri/tauri.conf.json together before tagging, or the release name/tag and the
#    app's own reported version will disagree).
#  - run it manually from the Actions tab (workflow_dispatch) -> builds every platform
#    but only uploads the installers as run artifacts, no Release is touched.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary: one .dmg/.app that runs natively on both Intel and Apple
          # Silicon, at the cost of compiling twice on this one runner.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04, not -latest: an AppImage built against an older glibc runs on more
          # end-user systems than one built on a newer distro. targets:"all" in
          # tauri.conf.json means this one job also produces .deb and .rpm.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # No packageManager field in package.json to auto-detect from; pin to match
          # what's used locally (pnpm-lock.yaml is a v9 lockfile).
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Tag push: build and attach installers to a draft GitHub Release.
      - name: Build and publish release
        id: tauri_release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'k8sman v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Manual dispatch: build only, no Release created or touched.
      - name: Build only
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # The AppImage is self-contained and bundles ~130 native libraries (much of it
      # LGPL-2.1+) that the .deb/.rpm instead declare as system dependencies. Redistributing
      # them is permitted but the LGPL expects their actual copyright notices and license
      # text to travel with the distribution. This reads them straight from dpkg's own
      # records on this runner - the same one that built the AppImage - so it's accurate
      # for the exact package versions bundled, not a hand-maintained snapshot.
      - name: Collect Linux bundled-library copyrights
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APPDIR="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type d -name '*.AppDir' | head -1)"
          ./scripts/collect-bundled-copyrights.sh "$APPDIR" THIRD-PARTY-COPYRIGHTS-LINUX-LIBS.txt

      - name: Attach Linux library copyrights to the release
        if: matrix.platform == 'ubuntu-22.04' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri_release.outputs.appVersion }}" THIRD-PARTY-COPYRIGHTS-LINUX-LIBS.txt --clobber

      - name: Upload Linux library copyrights artifact
        if: matrix.platform == 'ubuntu-22.04' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: k8sman-ubuntu-22.04-linux-lib-copyrights
          path: THIRD-PARTY-COPYRIGHTS-LINUX-LIBS.txt
          if-no-files-found: warn

      # One artifact per installer *format*, not one zip per OS - each of these globs
      # only matches the platform(s) that actually produce it, so `if-no-files-found:
      # ignore` lets the other platforms skip it silently rather than gating each step
      # on matrix.platform. Globs target the specific bundle subfolder + extension
      # (never a bare `bundle/**`) so the AppImage's unpacked staging directory
      # (`*.AppDir`, ~270MB of bundled webkit2gtk/GTK before it's squashed into the
      # final .AppImage) never gets swept in again.
      - name: Upload .deb artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: k8sman-${{ matrix.platform }}-deb
          path: src-tauri/target/**/bundle/deb/*.deb
          if-no-files-found: ignore

      - name: Upload .rpm artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: k8sman-${{ matrix.platform }}-rpm
          path: src-tauri/target/**/bundle/rpm/*.rpm
          if-no-files-found: ignore

      - name: Upload AppImage artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: k8sman-${{ matrix.platform }}-appimage
          path: src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Upload .dmg artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: k8sman-${{ matrix.platform }}-dmg
          path: src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload .msi artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: k8sman-${{ matrix.platform }}-msi
          path: src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: ignore

      - name: Upload NSIS installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: k8sman-${{ matrix.platform }}-setup
          path: src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: ignore
